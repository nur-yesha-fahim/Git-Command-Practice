<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nur Yesha Fahim - Portfolio</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* Background glowing ambient shapes for glassmorphism pop */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            z-index: -1;
            filter: blur(80px);
        }

        body::before {
            top: 10%;
            left: 10%;
            background: rgba(99, 102, 241, 0.3);
        }

        body::after {
            bottom: 10%;
            right: 10%;
            background: rgba(236, 72, 153, 0.2);
        }

        /* Glass Navigation Bar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            height: 80px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .nav {
            display: flex;
            list-style-type: none;
            gap: 40px;
        }

        .nav-item {
            text-decoration: none;
            color: #e2e8f0;
            font-weight: 500;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .nav-item:hover {
            color: #a855f7;
        }

        /* Hero Section */
        #hero {
            height: 100vh;
            width: 100%;
            display: flex;
            padding-top: 80px;
        }

        .hero-right {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px;
        }

        /* Glass Container for Hero Text */
        .hero-right-top {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 600px;
        }

        .hero-left {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #hero-txt1 {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
        }

        #hero-txt2 {
            font-size: 20px;
            font-weight: 400;
            color: #cbd5e1;
            margin-bottom: 5px;
        }

        #hero-txt3 {
            font-size: 18px;
            font-weight: 300;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        #hero-btn {
            height: 50px;
            width: 180px;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            font-weight: 600;
            font-size: 16px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #hero-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
        }

        /* Glass Profile Image Placeholder */
        #hero-img {
            height: 55vh;
            width: 28vw;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Contact Section Form */
        .from {
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
        }

        form {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 450px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Glass Footer */
        .footer {
            height: 15vh;
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul class="nav">
                <li><a href="#Home" class="nav-item">Home</a></li>
                <li><a href="#about" class="nav-item">About</a></li>
                <li><a href="#projects" class="nav-item">Projects</a></li>
                <li><a href="#contact" class="nav-item">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="hero">
            <div class="hero-right">
                <div class="hero-right-top">
                    <p id="hero-txt1">Hello, I am Nur Yesha Fahim</p>
                    <p id="hero-txt2">A passionate web developer with experience</p>
                    <p id="hero-txt3">in creating dynamic and responsive websites.</p>
                    <button id="hero-btn">Explore More</button>
                </div>
            </div>
            
        </section>

        <section class="from" id="contact">
            <form action="">
                <!-- Add form elements here -->
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Nur Yesha Fahim. All rights reserved.</p>
    </footer>
</body>

</html>
